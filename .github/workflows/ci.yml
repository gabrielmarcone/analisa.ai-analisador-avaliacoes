# Integração contínua: a cada push na main, a cada PR e uma vez por semana.
# - qualidade: os mesmos hooks do pre-commit (ruff, formatação, notebooks sem saída...).
# - testes: sem PyTorch, em Python 3.12 e 3.13, e com o pandas mínimo do requirements (2.2).
# - testes-bert: com PyTorch de CPU e o Transformers que salvou os modelos; nenhum teste
#   pode ser pulado (os testes de treino e da demo usam BERTs minúsculos, sem rede).
# - auditoria: vulnerabilidades conhecidas nas dependências (pip-audit), inclusive no
#   torch de CPU. A execução semanal pega falhas novas mesmo sem mudança no código.
# Cada job atualiza o pip antes de instalar: versões antigas dele têm falhas conhecidas.
# As ações são fixadas pelo commit (o comentário diz a versão); o Dependabot as atualiza.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "17 9 * * 1" # segunda-feira, 06:17 em Brasília
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  PIP_PROGRESS_BAR: "off"
  TORCH_INDEX: https://download.pytorch.org/whl/cpu
  TRANSFORMERS_VERSION: "5.22.1" # a mesma que salvou os modelos publicados

jobs:
  qualidade:
    name: Qualidade (pre-commit)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/pre-commit
          key: pre-commit-${{ runner.os }}-${{ hashFiles('.pre-commit-config.yaml') }}
      - name: Instala o pre-commit
        run: |
          python -m pip install --upgrade pip
          python -m pip install pre-commit
      - name: Roda todos os hooks em todos os arquivos
        run: pre-commit run --all-files --show-diff-on-failure

  testes:
    name: Testes sem PyTorch (Python ${{ matrix.python }}${{ matrix.extra && ', pandas 2.2' || '' }})
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - python: "3.12"
            extra: ""
          - python: "3.13"
            extra: ""
          - python: "3.12"
            extra: "pandas==2.2.*" # a versão mínima declarada no requirements.txt
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: requirements*.txt
      - name: Instala as dependências
        env:
          EXTRA: ${{ matrix.extra }}
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt -r requirements-dev.txt ${EXTRA:+"$EXTRA"}
          python -m pip install --no-deps -e .
          python -m pip check
          python -c "import pandas, numpy; print('pandas', pandas.__version__, '· numpy', numpy.__version__)"
      - name: Testes
        run: python -m pytest -q -rs

  testes-bert:
    name: Testes com PyTorch (CPU)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements*.txt
      - name: Instala o PyTorch de CPU e as dependências
        run: |
          python -m pip install --upgrade pip
          python -m pip install torch --index-url "$TORCH_INDEX"
          python -m pip install -r requirements.txt -r requirements-dev.txt -r requirements-bert.txt "transformers==$TRANSFORMERS_VERSION"
          python -m pip install --no-deps -e .
          python -m pip check
          python -c "import torch, transformers, accelerate; print('torch', torch.__version__, '· transformers', transformers.__version__, '· accelerate', accelerate.__version__)"
      - name: Testes
        run: python -m pytest -q -rs --junitxml=relatorio-testes.xml
      - name: Confere que nenhum teste foi pulado
        run: |
          python - <<'EOF'
          import xml.etree.ElementTree as ET
          suite = ET.parse("relatorio-testes.xml").getroot().find("testsuite")
          total, skipped = int(suite.get("tests")), int(suite.get("skipped"))
          print(f"{total} testes, {skipped} pulados")
          raise SystemExit(f"{skipped} teste(s) pulado(s) neste ambiente completo" if skipped else 0)
          EOF

  auditoria:
    name: Auditoria das dependências (pip-audit)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements*.txt
      - name: Instala o mesmo ambiente completo dos testes
        run: |
          python -m pip install --upgrade pip
          python -m pip install torch --index-url "$TORCH_INDEX"
          python -m pip install -r requirements.txt -r requirements-dev.txt -r requirements-bert.txt "transformers==$TRANSFORMERS_VERSION" pip-audit
      - name: Procura vulnerabilidades conhecidas
        run: pip-audit --progress-spinner off
      # O torch de CPU tem versão local ("2.15.0+cpu"), que o PyPI não conhece; sem este
      # passo o pip-audit o pularia. Os avisos de segurança valem para a versão pública.
      - name: Audita o PyTorch pela versão pública
        if: ${{ !cancelled() }}
        run: |
          python -c "from importlib.metadata import version; print('torch==' + version('torch').split('+')[0])" > torch-publico.txt
          cat torch-publico.txt
          pip-audit --progress-spinner off --no-deps --disable-pip -r torch-publico.txt
